<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY PORTAL</title>
  <style>
    /* ベース設定 */
    body { font-family: sans-serif; margin: 0; padding: 0; color: #333; background-color: #fafafa; }
    header { border-bottom: 2px solid #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
    .user-info { font-size: 12px; color: #666; margin-top: 5px; }
    .logout-btn { padding: 5px 15px; border: 2px solid #000; background: #fff; cursor: pointer; font-weight: bold; }
    
    /* タブメニュー */
    .tabs { display: flex; overflow-x: auto; border-bottom: 2px solid #000; background: #fff; padding: 10px 20px 0; gap: 10px; }
    .tab-btn { padding: 10px 20px; border: 2px solid #000; border-bottom: none; background: #fff; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .tab-btn.active { background: #000; color: #fff; }
    
    /* コンテンツエリア */
    .content { padding: 20px; max-width: 800px; margin: 0 auto; display: none; }
    .content.active { display: block; }
    
    /* 入力フォーム共通 */
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="text"], input[type="number"], select { padding: 10px; border: 1px solid #ccc; flex-grow: 1; }
    button.action-btn { padding: 10px 20px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    
    /* リスト共通 */
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; padding: 15px; background: #fff; border: 1px solid #ddd; margin-bottom: 10px; align-items: center; }
    .delete-btn { background: #ff4d4d; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    
    /* 家計簿サマリー */
    .finance-summary { display: flex; justify-content: space-between; background: #fff; padding: 15px; border: 2px solid #000; margin-bottom: 20px; font-weight: bold; }
    .finance-income { color: #2ecc71; }
    .finance-expense { color: #e74c3c; }

    /* レポート支援 */
    textarea { width: 100%; height: 150px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; resize: vertical; margin-bottom: 10px; }
    .section-title { border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 15px; }
    .char-count { text-align: right; font-size: 12px; color: #666; margin-bottom: 5px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>MY PORTAL</h1>
      <div class="user-info">ryo.aaa0621@icloud.com でログイン中</div>
    </div>
    <button class="logout-btn">ログアウト</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('todo')">📝 ToDo</button>
    <button class="tab-btn" onclick="switchTab('equipment')">🛒 備品リスト</button>
    <button class="tab-btn" onclick="switchTab('report')">📄 レポート支援</button>
    <button class="tab-btn" onclick="switchTab('links')">🎓 リンク集</button>
    <button class="tab-btn" onclick="switchTab('shopping')">🛍️ 買い物リスト</button>
    <button class="tab-btn" onclick="switchTab('finance')">💰 家計簿</button>
  </div>

  <!-- ToDo タブ -->
  <div id="todo" class="content active">
    <h2 class="section-title">ToDoリスト</h2>
    <div class="input-group">
      <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
      <select id="todo-priority">
        <option value="高">優先度: 高</option>
        <option value="中" selected>優先度: 中</option>
        <option value="低">優先度: 低</option>
      </select>
      <button class="action-btn" onclick="addItem('todo')">追加</button>
    </div>
    <ul id="todo-list"></ul>
  </div>

  <!-- 備品リスト タブ -->
  <div id="equipment" class="content">
    <h2 class="section-title">備品リスト</h2>
    <div class="input-group">
      <input type="text" id="equipment-input" placeholder="必要な備品を入力...">
      <button class="action-btn" onclick="addItem('equipment')">追加</button>
    </div>
    <ul id="equipment-list"></ul>
  </div>

  <!-- レポート支援 タブ -->
  <div id="report" class="content">
    <h2 class="section-title">レポート作成アシスタント</h2>
    <button class="action-btn" style="margin-bottom: 20px;" onclick="window.open('https://notebooklm.google.com/', '_blank')">NotebookLM を開く ↗</button>
    
    <div style="border: 2px solid #000; padding: 15px; margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between;">
        <strong>下書き・構成メモ</strong>
        <span class="char-count"><span id="char-count-val">0</span> 文字</span>
      </div>
      <textarea id="report-memo" placeholder="ここにレポートの構成や文章を入力..." oninput="updateCharCount()"></textarea>
    </div>

    <div style="border: 2px solid #000; padding: 15px;">
      <strong>参考文献 自動フォーマット</strong>
      <textarea id="report-refs" placeholder="URLを改行で複数貼り付け" style="height: 100px; margin-top: 10px;"></textarea>
      <button class="action-btn">参考文献を出力</button>
    </div>
  </div>

  <!-- リンク集 タブ -->
  <div id="links" class="content">
    <h2 class="section-title">リンク集</h2>
    <ul>
      <li><a href="#" target="_blank">大学ポータルサイト</a></li>
      <li><a href="#" target="_blank">Google Scholar</a></li>
      <li><a href="#" target="_blank">図書館データベース</a></li>
    </ul>
  </div>

  <!-- 買い物リスト タブ -->
  <div id="shopping" class="content">
    <h2 class="section-title">買い物リスト</h2>
    <div class="input-group">
      <input type="text" id="shopping-input" placeholder="買うものを入力...">
      <button class="action-btn" onclick="addItem('shopping')">追加</button>
    </div>
    <ul id="shopping-list"></ul>
  </div>

  <!-- 家計簿 タブ -->
  <div id="finance" class="content">
    <h2 class="section-title">家計簿</h2>
    
    <div class="finance-summary">
      <span class="finance-income">収入合計: <span id="total-income">0</span>円</span>
      <span class="finance-expense">支出合計: <span id="total-expense">0</span>円</span>
      <span>収支: <span id="total-balance">0</span>円</span>
    </div>

    <div class="input-group">
      <select id="finance-type">
        <option value="expense">支出</option>
        <option value="income">収入</option>
      </select>
      <input type="text" id="finance-name" placeholder="項目（例：食費、バイト代）" style="width: 40%;">
      <input type="number" id="finance-amount" placeholder="金額" style="width: 30%;">
      <button class="action-btn" onclick="addFinance()">追加</button>
    </div>
    <ul id="finance-list"></ul>
  </div>

  <script>
    // ★★★ GAS URL ★★★
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzWSTMccF34lDqPkjTgsZf-UCMq6ejYlAROxmEihd4bzzHkTmKHwg22tG6eocIlBuJUhA/exec';

    // タブ切り替え機能
    function switchTab(tabId) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // 文字数カウント（レポート支援）
    function updateCharCount() {
      const length = document.getElementById('report-memo').value.length;
      document.getElementById('char-count-val').innerText = length;
    }

    // LINE通知送信機能
    function sendLineNotify(message) {
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'message=' + encodeURIComponent(message)
      }).catch(err => console.error('LINE通知エラー:', err));
    }

    // 汎用リスト追加（ToDo, 備品, 買い物）
    function addItem(type) {
      const input = document.getElementById(`${type}-input`);
      let text = input.value.trim();
      
      if (!text) return;

      // ToDoの場合は優先度をつける
      let priorityText = "";
      if (type === 'todo') {
        const priority = document.getElementById('todo-priority').value;
        priorityText = ` [${priority}]`;
      }

      const list = document.getElementById(`${type}-list`);
      const li = document.createElement('li');
      li.innerHTML = `<span>${text} ${priorityText}</span> <button class="delete-btn" onclick="this.parentElement.remove()">削除</button>`;
      list.appendChild(li);

      // LINE通知のメッセージ作成
      let tabName = type === 'todo' ? 'ToDo' : type === 'equipment' ? '備品' : '買い物';
      sendLineNotify(`【${tabName}追加】\n${text}${priorityText}`);
      
      input.value = '';
    }

    // 家計簿の追加と計算
    let incomeTotal = 0;
    let expenseTotal = 0;

    function addFinance() {
      const type = document.getElementById('finance-type').value;
      const name = document.getElementById('finance-name').value.trim();
      const amount = parseInt(document.getElementById('finance-amount').value);

      if (!name || isNaN(amount)) return;

      const list = document.getElementById('finance-list');
      const li = document.createElement('li');
      
      let typeLabel = type === 'income' ? '収入' : '支出';
      let color = type === 'income' ? '#2ecc71' : '#e74c3c';

      li.innerHTML = `
        <span>[${typeLabel}] ${name}</span> 
        <strong style="color: ${color};">${amount.toLocaleString()}円</strong>
        <button class="delete-btn" onclick="removeFinance(this, '${type}', ${amount})">削除</button>
      `;
      list.appendChild(li);

      // 合計計算
      if (type === 'income') incomeTotal += amount;
      if (type === 'expense') expenseTotal += amount;
      updateFinanceSummary();

      // LINE通知
      sendLineNotify(`【家計簿追加】\n種別: ${typeLabel}\n項目: ${name}\n金額: ${amount.toLocaleString()}円`);

      // 入力欄リセット
      document.getElementById('finance-name').value = '';
      document.getElementById('finance-amount').value = '';
    }

    // 家計簿の削除
    function removeFinance(button, type, amount) {
      if (type === 'income') incomeTotal -= amount;
      if (type === 'expense') expenseTotal -= amount;
      updateFinanceSummary();
      button.parentElement.remove();
    }

    // 家計簿のサマリー表示更新
    function updateFinanceSummary() {
      document.getElementById('total-income').innerText = incomeTotal.toLocaleString();
      document.getElementById('total-expense').innerText = expenseTotal.toLocaleString();
      document.getElementById('total-balance').innerText = (incomeTotal - expenseTotal).toLocaleString();
    }
  </script>
</body>
</html>
